name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.13'
  PNPM_VERSION: '11.5.2'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          DISPATCH_DRAFT: ${{ inputs.draft }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION=$(jq -r .version desktop/package.json)
            TAG="v${VERSION}"
            DRAFT="${DISPATCH_DRAFT:-false}"
            PRERELEASE="${DISPATCH_PRERELEASE:-false}"

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists locally."
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists on origin."
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          else
            TAG="$REF_NAME"
            DRAFT="false"
            PRERELEASE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-browser:
    name: Build Browser Bundle
    needs: prepare-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: browser/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Create browser archive
        run: |
           cd dist
           zip -r ../nanokvm-usb-browser-${{ needs.prepare-release.outputs.release_tag }}.zip .
           cd ..

      - name: Upload browser artifact
        uses: actions/upload-artifact@v7
        with:
           name: browser-release
           path: browser/nanokvm-usb-browser-${{ needs.prepare-release.outputs.release_tag }}.zip
           if-no-files-found: error

  build-desktop:
    name: Build Desktop Apps
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_script: build:linux-full
            artifact_name: desktop-linux
          - os: windows-latest
            target: windows
            build_script: build:win-full
            artifact_name: desktop-windows
          - os: macos-latest
            target: macos
            build_script: build:mac-full
            artifact_name: desktop-macos
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev rpm

      - name: Import Code-Signing Certificates
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm run ${{ matrix.build_script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.dmg
            desktop/dist/*-mac.zip
            desktop/dist/latest*.yml
          if-no-files-found: error

  build-native-macos:
    name: Build Native macOS Client
    needs: prepare-release
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Build native app
        run: bash build.command

      - name: Verify app bundle
        run: |
          file NanoKVM.app/Contents/MacOS/NanoKVM
          codesign --verify --deep --strict --verbose=2 NanoKVM.app

      - name: Create native app archive
        run: ditto -c -k --keepParent NanoKVM.app ../nanokvm-usb-native-macos-arm64-${{ needs.prepare-release.outputs.release_tag }}.zip

      - name: Upload native app artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-arm64
          path: nanokvm-usb-native-macos-arm64-${{ needs.prepare-release.outputs.release_tag }}.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build-browser, build-desktop, build-native-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Display structure of downloaded files
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_tag }}
          draft: ${{ needs.prepare-release.outputs.draft }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          files: |
            release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
