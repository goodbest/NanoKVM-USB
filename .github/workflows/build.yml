name: Build Browser, Desktop, and Native macOS Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '22.13'
  PNPM_VERSION: '11.5.2'

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      desktop: ${{ steps.filter.outputs.desktop }}
      native_macos: ${{ steps.filter.outputs.native_macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            browser:
              - 'browser/**'
              - '.github/workflows/build.yml'
            desktop:
              - 'desktop/**'
              - '.github/workflows/build.yml'
            native_macos:
              - 'macos/**'
              - '.github/workflows/build.yml'

  build-browser:
    name: Build Browser Bundle
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.browser == 'true'
    defaults:
      run:
        working-directory: browser
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: browser/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build static site
        run: pnpm run build

      - name: Upload browser dist
        uses: actions/upload-artifact@v7
        with:
          name: browser-dist
          path: browser/dist
          if-no-files-found: error

  build-desktop:
    name: Build Desktop Apps
    needs: detect-changes
    runs-on: ${{ matrix.os }}
    if: needs.detect-changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_script: build:linux
            artifact_name: desktop-linux
          - os: windows-latest
            target: windows
            build_script: build:win
            artifact_name: desktop-windows
          - os: macos-14
            target: macos
            build_script: build:mac-full
            artifact_name: desktop-macos
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build desktop package
        run: pnpm run ${{ matrix.build_script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist
          if-no-files-found: error

  build-native-macos:
    name: Build Native macOS Client
    needs: detect-changes
    runs-on: macos-14
    if: needs.detect-changes.outputs.native_macos == 'true'
    defaults:
      run:
        working-directory: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build native app
        run: bash build.command

      - name: Verify app bundle
        run: |
          file NanoKVM.app/Contents/MacOS/NanoKVM
          codesign --verify --deep --strict --verbose=2 NanoKVM.app

      - name: Archive native app
        run: ditto -c -k --keepParent NanoKVM.app ../nanokvm-usb-native-macos-arm64.zip

      - name: Upload native macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-arm64
          path: nanokvm-usb-native-macos-arm64.zip
          if-no-files-found: error
